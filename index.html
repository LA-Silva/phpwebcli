<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive BOP Shell (Browser-Oriented PHP)</title>

    <!-- jQuery Terminal CSS -->
    <link rel="stylesheet" href="./assets/jquery.terminal.min.css"/>
    <!-- PrismJS CSS for Syntax Highlighting -->
    <link rel="stylesheet" href="./assets/prism-coy.min.css"/>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        /* Fix PrismJS background clash inside jQuery Terminal */
        .terminal .token {
            background: transparent !important;
        }
        /* Option 2: 2D Character Framebuffer Overlay */
        #screen-framebuffer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            color: #aaa;
            overflow: hidden;
            box-sizing: border-box;
        }
        #screen-framebuffer.active {
            display: block;
        }
        #screen-framebuffer.active.pixel-mode {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #screen-framebuffer.pixel-mode #screen-framebuffer-pre {
            display: none;
        }
        #screen-framebuffer-canvas {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
        }
        #screen-framebuffer.pixel-mode #screen-framebuffer-canvas {
            display: block;
        }
        #screen-framebuffer-pre {
            margin: 0;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            line-height: 14px;
            white-space: pre;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: text;
        }
        #screen-framebuffer-pre .screen-cursor {
            background: #aaa;
            color: #000;
            animation: screen-cursor-blink 1s steps(1, end) infinite;
        }
        @keyframes screen-cursor-blink {
            0%, 49% { background: #aaa; color: #000; }
            50%, 100% { background: transparent; color: #aaa; }
        }
        #screen-exit-btn {
            position: fixed;
            top: 6px;
            right: 10px;
            z-index: 10000;
            background: rgba(34, 34, 34, 0.8);
            color: #aaa;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 11px;
            padding: 2px 7px;
            cursor: pointer;
            opacity: 0.55;
        }
        #screen-exit-btn:hover {
            opacity: 1;
            border-color: #888;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="screen-framebuffer" aria-live="polite">
        <button id="screen-exit-btn" type="button" title="Return to BOP prompt">ESC: Exit Screen</button>
        <pre id="screen-framebuffer-pre"></pre>
        <canvas id="screen-framebuffer-canvas"></canvas>
    </div>

    <!-- 1. jQuery -->
    <script src="./assets/jquery.min.js"></script>

    <!-- 2. PrismJS + Grammar Definition (Required for $.terminal.syntax('bop')) -->
    <script src="./assets/prism.min.js"></script>
    <script src="./assets/prism-markup-templating.min.js"></script>
    <script src="./assets/prism-php.min.js"></script>

    <!-- 3. jQuery Terminal + Prism Syntax Plugin -->
    <script src="./assets/jquery.terminal.min.js"></script>
    <script src="./assets/prism.js"></script>

    <!-- 4. Standalone Pure-JS BOP Engine -->
    <script src="./bop_engine.js"></script>

    <!-- 5. App Runtime Modules (VFS, SQLite/PDO, 2D Screen Buffer, BOP Bridge) -->
    <script src="./vfs.js"></script>
    <script src="./minisql.js"></script>
    <script src="./screen_buffer.js"></script>
    <script src="./bop_bridge.js"></script>

    <script>
        $(function() {
            const vfs = createLocalStorageVfs('bopwebcli_vfs_v1');
            const miniSql = createMiniSqlEngine(vfs);
            let term = null;
            const screenBuffer = createScreenBuffer({
                getTerm: function() { return term; }
            });

            // Initialize native BOP runtime engine backed by localStorage VFS
            const bop = createBopEngine({
                fileSystem: vfs,
                include: function(path, promise) {
                    if (vfs.isFile(path)) {
                        promise.resolve(vfs.readFile(path));
                        return;
                    }
                    fetch(path)
                        .then(function(res) {
                            if (!res.ok) {
                                throw new Error('File not found: ' + path);
                            }
                            const contentType = (res.headers && res.headers.get('content-type')) || '';
                            if (!/\.html?(\?|#|$)/i.test(String(path)) && contentType.toLowerCase().includes('text/html')) {
                                throw new Error('File not found: ' + path);
                            }
                            return res.text();
                        })
                        .then(function(code) {
                            promise.resolve(code);
                        })
                        .catch(function(err) {
                            promise.reject(err);
                        });
                }
            });

            // Register BOP stream primitives, constants, sprintf(), and get_defined_functions()
            registerBopStreamFunctions(bop, vfs);
            registerBopEngineExtensions(bop);

            // Build and expose $bridge and $meta to BOP
            const appBridge = createBopBridge({
                $: $,
                fetch: typeof fetch === 'function' ? fetch : null,
                bop: bop,
                vfs: vfs,
                miniSql: miniSql,
                screenBuffer: screenBuffer,
                getTerm: function() { return term; }
            });

            bop.expose(appBridge, 'bridge');
            bop.expose({
                engine: 'BOP',
                environment: 'browser'
            }, 'meta');

            // Enable BOP syntax highlighting via PrismJS
            if (typeof Prism !== 'undefined' && Prism.languages && Prism.languages.php) {
                Prism.languages.bop = Prism.languages.php;
            }
            $.terminal.syntax('bop');

            // __toString magic method helper for jQuery objects
            $.fn.__toString = function() {
                return `#<jQuery(${this.length})>`;
            };

            // Initialize jQuery Terminal
            term = $('body').terminal(function(command) {
                const raw = command.trim();
                if (raw === '') {
                    return;
                }
                let src;
                if (/^(?:<\?bop\b|<\?=)/i.test(raw)) {
                    src = raw;
                } else {
                    let body = raw;
                    if (!body.endsWith(';') && !body.endsWith('}')) {
                        body += ';';
                    }
                    src = '<?bop ' + body;
                }
                bop.execute(src).fail(function(err) {
                    term.error(formatBopError(err.message || String(err)));
                });
            }, {
                greetings: 'Interactive BOP Shell (Browser-Oriented PHP)\nType BOP code (e.g., echo "Hello"; or $jQuery("body")->css("background", "#111");)\n',
                name: 'bop',
                prompt: 'bop > '
            });

            // Pipe BOP stdout and stderr to either active 2D screen framebuffer or terminal
            bop.getStdout().on('data', function(text) {
                const formatted = formatBopError(text);
                if (screenBuffer.active) {
                    screenBuffer.write(formatted);
                } else {
                    term.echo(formatted, { newline: false });
                }
            });

            bop.getStderr().on('data', function(text) {
                term.error(formatBopError(text));
            });

            async function includeBop(url) {
                const res = await fetch(url);
                const contentType = (res.headers && res.headers.get('content-type')) || '';
                if (!res.ok || (!/\.html?(\?|#|$)/i.test(String(url)) && contentType.toLowerCase().includes('text/html'))) {
                    term.error(`File not found: ${url}`);
                    return;
                }
                const code = await res.text();
                const src = /<\?(?:bop|=)/i.test(code) ? code : ('<?bop ' + code);
                return bop.execute(src, url).fail(function(err) {
                    term.error(formatBopError(err.message || String(err)));
                });
            }

            // Expose terminal/DOM/include/mask helpers to BOP
            bop.expose(term, 'term');
            bop.expose($, 'jQuery');
            bop.expose(includeBop, 'includeBop');
            bop.expose(function(janee) { term.set_mask(false); return janee; }, 'maskuit');
            bop.expose(function(janee) { term.set_mask('*'); return janee; }, 'maskaan');

            // Serialized interactive input queue ($io->read / $io->readline)
            const readQueue = [];
            let isReading = false;

            function processReadQueue() {
                if (isReading || readQueue.length === 0) {
                    return;
                }
                isReading = true;
                const item = readQueue.shift();
                const previousMask = term.get_mask();
                let finished = false;

                function completeRead(wasCancelled, value) {
                    if (finished) {
                        return;
                    }
                    finished = true;
                    setTimeout(function() {
                        if (term.get_mask() !== previousMask) {
                            term.set_mask(previousMask);
                        }
                        isReading = false;
                        if (typeof item.onComplete === 'function') {
                            item.onComplete(wasCancelled, value);
                        }
                        processReadQueue();
                    }, 0);
                }

                term.read(
                    item.promptText,
                    function(input) {
                        try {
                            if (typeof item.onLine === 'function') {
                                item.onLine(input);
                            }
                        } finally {
                            completeRead(false, input);
                        }
                    },
                    function() {
                        completeRead(true, null);
                    }
                );

                if (item.isSecret) {
                    term.set_mask('*');
                } else if (term.get_mask()) {
                    term.set_mask(false);
                }
            }

            function enqueueRead(promptText, secret, onLine) {
                return new Promise(function(resolve) {
                    readQueue.push({
                        promptText: String(promptText ?? '> '),
                        isSecret: Boolean(secret),
                        onLine: onLine,
                        onComplete: function(_wasCancelled, value) {
                            resolve(value);
                        }
                    });
                    processReadQueue();
                });
            }

            bop.expose({
                read: function(promptText, secret) {
                    return bop.createFFIResult(
                        function() {
                            throw new Error('io->read requires BOP async mode');
                        },
                        function() {
                            return enqueueRead(promptText, secret);
                        }
                    );
                },
                readline: function(promptText, onLine, secret) {
                    if (typeof onLine !== 'function') {
                        return bop.createFFIResult(
                            function() {
                                throw new Error('io->readline without callback requires BOP async mode');
                            },
                            function() {
                                return enqueueRead(promptText, secret);
                            }
                        );
                    }
                    enqueueRead(promptText, secret, onLine);
                }
            }, 'io');

            // Boot BOP standard library modules sequentially
            includeBop('lib/strings.bop').then(function() {
                return includeBop('lib/dates.bop');
            }).then(function() {
                return includeBop('lib/cron.bop');
            }).then(function() {
                return includeBop('lib/files.bop');
            }).then(function() {
                return includeBop('lib/math.bop');
            }).then(function() {
                return includeBop('lib/arrays.bop');
            }).then(function() {
                return includeBop('lib/sqlite.bop');
            }).then(function() {
                return includeBop('lib/screen.bop');
            }).then(function() {
                return includeBop('lib/stdlib.bop');
            });
        });
    </script>
</body>
</html>
